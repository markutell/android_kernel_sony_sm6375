name: PDX225 KernelSU Next Boot Image

on:
  workflow_dispatch:
  push:
    branches:
      - lineage-24.0

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          path: kernel/sony/sm6375

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git curl wget jq unzip python3 \
            bc bison flex build-essential \
            libssl-dev libelf-dev \
            libncurses-dev dwarves lz4 cpio \
            rsync zip

      - name: Download Clang
        run: |
          git clone --depth=1 --branch ruby \
            https://github.com/AOSPA/android_prebuilts_clang_host_linux-x86.git clang-src
          test -x clang-src/clang-r416183b/bin/clang
          echo "$GITHUB_WORKSPACE/clang-src/clang-r416183b/bin" >> "$GITHUB_PATH"

      - name: Setup KernelSU Next
        working-directory: kernel/sony/sm6375
        run: |
          curl -LSs https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh | bash -s legacy
          test -d KernelSU-Next

      - name: Download official PDX225 boot image
        run: |
          set -euxo pipefail

          curl -fL \
            https://download.lineageos.org/api/v2/devices/pdx225/builds \
            -o builds.json

          jq 'type, (if type == "array" then .[0] else keys end)' builds.json

          OTA_URL=$(jq -r '
            if type == "array" then
              [.[0].files[]? | select(.filename | endswith(".zip"))][0].url
            else
              empty
            end
          ' builds.json)

          test -n "$OTA_URL"
          test "$OTA_URL" != "null"

          curl -fL "$OTA_URL" -o lineage.zip

          unzip -p lineage.zip payload.bin > payload.bin
          test -s payload.bin

      - name: Get magiskboot
        run: |
          set -euxo pipefail
          MAGISK_URL=$(curl -fsSL https://api.github.com/repos/topjohnwu/Magisk/releases/latest |
            jq -r '.assets[] | select(.name | endswith(".apk")) | .browser_download_url' |
            head -n1)
          test -n "$MAGISK_URL"
          curl -fL "$MAGISK_URL" -o magisk.apk
          unzip -p magisk.apk lib/x86_64/libmagiskboot.so > magiskboot
          chmod +x magiskboot
          ./magiskboot --help || true

      - name: Extract original boot and vendor_boot images
        run: |
          set -euxo pipefail
          ./magiskboot extract payload.bin boot boot.img
          ./magiskboot extract payload.bin vendor_boot vendor_boot.img
          test -s vendor_boot.img
          test -s boot.img

      - name: Configure kernel
        working-directory: kernel/sony/sm6375
        shell: bash
        run: |
          set -euxo pipefail
          export ARCH=arm64
          export LLVM=1
          export PATH="$GITHUB_WORKSPACE/clang-src/clang-r416183b/bin:$PATH"
          make O=out vendor/holi-qgki_defconfig
          scripts/kconfig/merge_config.sh -m -O out \
            out/.config \
            arch/arm64/configs/diffconfig/common.config \
            arch/arm64/configs/diffconfig/pdx225.config
          scripts/config --file out/.config \
            --enable MODULES \
            --enable KPROBES \
            --enable KPROBE_EVENTS \
            --enable KSU \
            --enable LEDS_CLASS \
          make O=out olddefconfig
          for option in MODULES KPROBES KPROBE_EVENTS KSU LEDS_CLASS ARCH_SONY_MURRAY; do
            grep -qx "CONFIG_${option}=y" out/.config || exit 1
          done

      - name: Build kernel
        working-directory: kernel/sony/sm6375
        run: |
          set -euxo pipefail
          export ARCH=arm64
          export LLVM=1
          export PATH="$GITHUB_WORKSPACE/clang-src/clang-r416183b/bin:$PATH"

          make -j"$(nproc)" O=out \
            Image dtbs

          test -s out/arch/arm64/boot/Image
          cp out/arch/arm64/boot/Image "$GITHUB_WORKSPACE/Image"

      - name: Repack boot image
        run: |
          set -euxo pipefail

          mkdir boot-work
          cd boot-work

          cp ../boot.img .
          cp ../Image .

          ../magiskboot unpack boot.img

          test -s kernel
          cp Image kernel

          ../magiskboot repack boot.img new-boot.img

          test -s new-boot.img
          ../magiskboot unpack new-boot.img

          test -s kernel
          echo "Custom boot image generated successfully."

          mkdir -p "$GITHUB_WORKSPACE/output"
          cp new-boot.img "$GITHUB_WORKSPACE/output/boot.img"
          cp ../Image "$GITHUB_WORKSPACE/output/Image"
          cp ../boot.img "$GITHUB_WORKSPACE/output/boot-original.img"

      - name: Repack vendor_boot image
        run: |
          set -euxo pipefail
          mkdir vb-work
          cd vb-work
          cp ../vendor_boot.img .
          cp ../Image .
          ../magiskboot unpack vendor_boot.img
          if [ -f kernel ]; then cp Image kernel; fi
          ../magiskboot repack vendor_boot.img new-vendor_boot.img
          test -s new-vendor_boot.img
          mkdir -p "$GITHUB_WORKSPACE/output"
          cp new-vendor_boot.img "$GITHUB_WORKSPACE/output/vendor_boot.img"
          cp ../vendor_boot.img "$GITHUB_WORKSPACE/output/vendor_boot-original.img"

      - name: Upload flashable boot image
        uses: actions/upload-artifact@v4
        with:
          name: PDX225-KernelSU-Next-boot
          path: output/
          if-no-files-found: error
